<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Grid untuk Statistik */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .stat-card.over {
            border-color: var(--danger);
            background-color: #fef2f2;
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card p {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Form Container & Grid */
        .form-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        /* Grid Form (5 Kolom) */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-group input,
        .form-group select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background-color: #fff;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            display: none;
        }

        .action-btn {
            padding: 4px 8px;
            font-size: 0.8rem;
            margin-right: 4px;
        }

        .btn-edit {
            background-color: #eab308;
            color: white;
        }

        .btn-delete {
            background-color: var(--danger);
            color: white;
        }

        /* Table Container */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 24px;
        }

        /* Tag jenis transaksi di tabel */
        .text-income {
            color: var(--success);
            font-weight: 600;
        }

        .text-expense {
            color: var(--danger);
            font-weight: 600;
        }

        /* Responsif untuk HP */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr; /* Jadi 1 kolom di HP */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Student Expense Tracker</h1>
        <p>Kelola keuangan bulanan Anda...</p>
    </header>

    <!-- 1. STATISTIK SECTION -->
    <section class="stats-grid">
        <div class="stat-card">
            <h3>Pengeluaran Hari Ini</h3>
            <p id="stat-today">Rp 0</p>
        </div>
        <div class="stat-card">
            <h3>Pengeluaran Bulan Ini</h3>
            <p id="stat-month">Rp 0</p>
        </div>
        <div class="stat-card" id="card-budget">
            <h3>Sisa Anggaran</h3>
            <p id="stat-budget">Rp 0</p>
        </div>
    </section>

    <!-- 2. FORM SECTION -->
    <section class="form-container">
        <form id="expense-form">
            <div class="form-grid">
                <!-- Tambahan Pilihan Jenis Transaksi -->
                <div class="form-group">
                    <label for="type">Jenis</label>
                    <select id="type" required>
                        <option value="expense">Pengeluaran (-)</option>
                        <option value="income">Pemasukan (+)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="desc">Deskripsi</label>
                    <input type="text" id="desc" placeholder="Cth: Keluar/Masuk" required>
                </div>
                <div class="form-group">
                    <label for="amount">Nominal (Rp)</label>
                    <input type="number" id="amount" placeholder="50000" min="1" required>
                </div>
                <div class="form-group">
                    <label for="category">Kategori</label>
                    <select id="category" required>
                        <option value="Anggaran">Tambahan Duit</option>
                        <option value="Makan">Makan</option>
                        <option value="Minum">Minum</option>
                        <option value="Transport">Transport</option>
                        <option value="Kuota">Kuota</option>
                        <option value="Hutang">Hutang</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <div style="display: flex; gap: 8px;">
                        <button type="submit" class="btn-primary" id="btn-submit">Simpan</button>
                        <button type="button" class="btn-cancel" id="btn-cancel">Batal</button>
                    </div>
                </div>
            </div>

            <!-- Hidden field untuk menyimpan ID saat mode Edit -->
            <input type="hidden" id="edit-id">
        </form>
    </section>

    <!-- 3. TABLE SECTION -->
    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Deskripsi</th>
                    <th>Kategori</th>
                    <th>Nominal</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="expense-list">
                <!-- Default state saat data belum dimuat -->
                <tr>
                    <td colspan="5" class="empty-state">Memuat data...</td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- JAVASCRIPT & FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // KONFIGURASI FIREBASE (Ganti sesuai punya Anda)
        const firebaseConfig = {
            apiKey: "AIzaSyC-ffmH_V--55SYD2bdlb-_sHbPssEzhZg",
            authDomain: "praktikum-crud-byma.firebaseapp.com",
            projectId: "praktikum-crud-byma",
            storageBucket: "praktikum-crud-byma.firebasestorage.app",
            messagingSenderId: "1081652346017",
            appId: "1:1081652346017:web:5ded88f0c337b19a6704e0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const expensesCollection = collection(db, "expenses");

        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        const q = query(expensesCollection, orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('expense-list');
            list.innerHTML = '';

            let totalToday = 0;
            let totalMonth = 0;
            let totalAddedIncome = 0; // Total pemasukan/tambahan anggaran

            const now = new Date();
            const currentMonth = now.getMonth();
            const todayString = now.toDateString();

            if (snapshot.empty) {
                list.innerHTML = '<tr><td colspan="5" class="empty-state">Belum ada data.</td></tr>';
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const expDate = data.createdAt?.toDate() || new Date();
                const isIncome = data.type === 'income';

                // Hitung total pemasukan dan pengeluaran
                if (isIncome) {
                    totalAddedIncome += data.amount;
                } else {
                    if (expDate.toDateString() === todayString) {
                        totalToday += data.amount;
                    }
                    if (expDate.getMonth() === currentMonth) {
                        totalMonth += data.amount;
                    }
                }

                // Render baris tabel
                const row = document.createElement('tr');
                const amountClass = isIncome ? 'text-income' : 'text-expense';
                const prefix = isIncome ? '+ ' : '- ';

                row.innerHTML = `
                    <td>${expDate.toLocaleDateString('id-ID')}</td>
                    <td>${data.description}</td>
                    <td><span class="badge badge-${data.category.toLowerCase()}">${data.category}</span></td>
                    <td class="${amountClass}">${prefix}${formatRupiah(data.amount)}</td>
                    <td>
                        <button class="action-btn btn-edit" onclick="window.editExpense('${id}', '${data.description}', ${data.amount}, '${data.category}', '${data.type || 'expense'}')">Edit</button>
                        <button class="action-btn btn-delete" onclick="window.deleteExpense('${id}')">Hapus</button>
                    </td>
                `;
                list.appendChild(row);
            });

            // Anggaran Pokok + Tambahan Pemasukan - Total Pengeluaran
            const baseBudget = 1500000; 
            const remaining = (baseBudget + totalAddedIncome) - totalMonth;

            document.getElementById('stat-today').textContent = formatRupiah(totalToday);
            document.getElementById('stat-month').textContent = formatRupiah(totalMonth);
            document.getElementById('stat-budget').textContent = formatRupiah(remaining);

            const budgetCard = document.getElementById('card-budget');
            if (remaining < 0) {
                budgetCard.classList.add('over');
            } else {
                budgetCard.classList.remove('over');
            }
        });

        // HANDLE FORM SUBMIT (CREATE / UPDATE)
        document.getElementById('expense-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('type').value;
            const desc = document.getElementById('desc').value;
            const amount = Number(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const editId = document.getElementById('edit-id').value;

            try {
                if (editId) {
                    await updateDoc(doc(db, "expenses", editId), {
                        type: type,
                        description: desc,
                        amount: amount,
                        category: category
                    });
                } else {
                    await addDoc(expensesCollection, {
                        type: type,
                        description: desc,
                        amount: amount,
                        category: category,
                        createdAt: serverTimestamp()
                    });
                }
                resetForm();
            } catch (error) {
                console.error("Error: ", error);
                alert("Gagal menyimpan data.");
            }
        });

        // DELETE
        window.deleteExpense = async (id) => {
            if (confirm("Yakin ingin menghapus data ini?")) {
                await deleteDoc(doc(db, "expenses", id));
            }
        };

        // EDIT
        window.editExpense = (id, desc, amount, category, type) => {
            document.getElementById('type').value = type || 'expense';
            document.getElementById('desc').value = desc;
            document.getElementById('amount').value = amount;
            document.getElementById('category').value = category;
            document.getElementById('edit-id').value = id;

            document.getElementById('btn-submit').textContent = 'Update';
            document.getElementById('btn-cancel').style.display = 'inline-block';
        };

        // RESET
        function resetForm() {
            document.getElementById('expense-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('btn-submit').textContent = 'Simpan';
            document.getElementById('btn-cancel').style.display = 'none';
        }

        document.getElementById('btn-cancel').addEventListener('click', resetForm);
    </script>
</body>
</html>
